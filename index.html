<!-- SAHIL AI VOICE AGENT CORE SCRIPT -->
  <script>
    let isAgentActive = false;
    let isAgentListening = false;
    let isAgentProcessing = false;
    let sahilRecognition;
    let sahilHistory = [];
    let sahilVoices = [];
    let morphInterval = null;

    function loadSahilVoices() {
      sahilVoices = window.speechSynthesis.getVoices();
    }
    if ('speechSynthesis' in window) {
      loadSahilVoices();
      window.speechSynthesis.onvoiceschanged = loadSahilVoices;
    }

    function extractPortfolioContext() {
      return {
        title: document.title,
        headings: Array.from(document.querySelectorAll('h1, h2, h3')).map(h => h.innerText.trim()),
        paragraphs: Array.from(document.querySelectorAll('p')).map(p => p.innerText.trim()).slice(0, 12),
        skills: ["AI Poster Design", "High-CTR Thumbnails", "CapCut Motion Video Editing", "Short-form Reels"],
        tools: ["Canva", "CapCut", "Google AI Studio", "LLM Workflows"]
      };
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      sahilRecognition = new SpeechRecognition();
      sahilRecognition.continuous = false; // Changed to false to prevent mic locking loops
      sahilRecognition.interimResults = false;

      sahilRecognition.onresult = async (event) => {
        if (isAgentProcessing) return;
        const transcript = event.results[0][0].transcript.trim();
        if (!transcript) return;

        stopSahilListeningState();
        await sendQueryToSahilBackend(transcript);
      };

      sahilRecognition.onerror = (event) => {
        // Auto recover on no-speech or network glitches
        if (event.error === 'no-speech' || event.error === 'aborted') {
          if (isAgentActive && !isAgentProcessing) {
            try { sahilRecognition.start(); } catch(e){}
          } else {
            stopSahilListeningState();
          }
        } else {
          stopSahilListeningState();
        }
      };

      sahilRecognition.onend = () => {
        // If agent is active and not currently speaking/processing, keep mic open seamlessly
        if (isAgentActive && !isAgentProcessing && !isAgentListening) {
          try {
            sahilRecognition.start();
          } catch(e) {}
        }
      };
    }

    function toggleSahilAgent() {
      const boxContent = document.getElementById('box-content');
      const coreIndicator = document.getElementById('jarvis-core-indicator');

      if (!isAgentActive) {
        isAgentActive = true;
        if (boxContent) boxContent.style.opacity = '0';
        setTimeout(() => {
          if (boxContent) boxContent.style.display = 'none';
          if (coreIndicator) coreIndicator.style.opacity = '1';
        }, 300);

        const greeting = "Hello! I am Sahil Kumar. Welcome to my portfolio—what design or video project shall we work on today?";
        sahilHistory.push({ role: 'model', text: greeting });
        speakSahilReply(greeting);
      } else {
        isAgentActive = false;
        stopSahilListeningState();
        window.speechSynthesis.cancel();
        try { sahilRecognition.stop(); } catch(e){}

        if (coreIndicator) coreIndicator.style.opacity = '0';
        setTimeout(() => {
          if (boxContent) {
            boxContent.style.display = 'flex';
            boxContent.innerHTML = `
              <div class="w-12 h-12 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center mb-3 text-white shadow-lg">
                <i data-lucide="mic" class="w-6 h-6 text-indigo-300"></i>
              </div>
              <h3 class="text-white font-extrabold text-sm sm:text-base tracking-wider uppercase mb-1">
                ASK FOR SAHIL
              </h3>
              <p id="voiceStatusText" class="text-indigo-200 text-xs font-medium">
                Click here to talk to Sahil
              </p>
            `;
            lucide.createIcons();
            setTimeout(() => { boxContent.style.opacity = '1'; }, 50);
          }
        }, 300);

        setCubicalState();
      }
    }

    function setCubicalState() {
      const outer = document.getElementById('jarvis-outer');
      if (!outer) return;
      outer.style.borderRadius = '32px';
    }

    function startVoiceMorphAnimation() {
      clearInterval(morphInterval);
      morphInterval = setInterval(() => {
        const outer = document.getElementById('jarvis-outer');
        if (!outer) return;

        const f1 = (Math.random() - 0.5) * 30;
        const f2 = (Math.random() - 0.5) * 30;
        const r1 = Math.round(42 + f1);
        const r2 = Math.round(58 - f1);
        const r3 = Math.round(55 + f2);
        const r4 = Math.round(45 - f2);

        outer.style.borderRadius = `${r1}% ${r2}% ${r3}% ${r4}% / ${r4}% ${r1}% ${r2}% ${r3}%`;
      }, 180);
    }

    function stopVoiceMorphAnimation() {
      clearInterval(morphInterval);
      setCubicalState();
    }

    function startSahilListeningState() {
      if (!isAgentActive) return;
      isAgentListening = true;
      isAgentProcessing = false;
      const statusText = document.getElementById('voiceStatusText');
      if (statusText) statusText.innerText = 'Listening... Speak now';
      startVoiceMorphAnimation();
      try {
        sahilRecognition.start();
      } catch(e) {}
    }

    function stopSahilListeningState() {
      isAgentListening = false;
      stopVoiceMorphAnimation();
      try {
        sahilRecognition.stop();
      } catch(e) {}
    }

    async function sendQueryToSahilBackend(userText) {
      if (!isAgentActive) return;
      isAgentProcessing = true;
      const statusText = document.getElementById('voiceStatusText');
      if (statusText) statusText.innerText = 'Thinking...';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            userQuery: userText, 
            siteData: extractPortfolioContext(), 
            history: sahilHistory 
          })
        });

        const data = await response.json();
        if (data.reply && isAgentActive) {
          sahilHistory.push({ role: 'user', text: userText });
          sahilHistory.push({ role: 'model', text: data.reply });
          
          // Navigation triggers
          const lowerUserQuery = userText.toLowerCase();
          const lowerReply = data.reply.toLowerCase();

          if (lowerUserQuery.includes('capabilities') || lowerReply.includes('capabilities')) {
            document.getElementById('capabilities').scrollIntoView({ behavior: 'smooth' });
          } else if (lowerUserQuery.includes('identity') || lowerReply.includes('identity') || lowerUserQuery.includes('about')) {
            document.getElementById('about').scrollIntoView({ behavior: 'smooth' });
          } else if (lowerUserQuery.includes('showcase') || lowerReply.includes('showcase') || lowerUserQuery.includes('poster')) {
            document.getElementById('showcase').scrollIntoView({ behavior: 'smooth' });
          }

          speakSahilReply(data.reply);
        } else {
          isAgentProcessing = false;
          if (isAgentActive) startSahilListeningState();
        }
      } catch (err) {
        isAgentProcessing = false;
        if (isAgentActive) startSahilListeningState();
      }
    }

    function speakSahilReply(text) {
      if (!isAgentActive) return;
      const statusText = document.getElementById('voiceStatusText');
      if (statusText) statusText.innerText = 'Sahil is speaking...';
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      const isHindi = /[\u0900-\u097F]/.test(text);

      if (sahilVoices.length === 0) sahilVoices = window.speechSynthesis.getVoices();

      let selectedVoice = null;
      if (isHindi) {
        utterance.lang = 'hi-IN';
        selectedVoice = sahilVoices.find(v => v.lang === 'hi-IN' || v.name.includes('Hindi') || v.name.includes('Google हिन्दी'));
      } else {
        utterance.lang = 'en-IN';
        selectedVoice = sahilVoices.find(v => v.lang === 'en-IN' || v.name.includes('India') || v.name.includes('English'));
      }

      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      startVoiceMorphAnimation();

      let hasFinishedSpeaking = false;
      const finishSpeakingOnce = () => {
        if (hasFinishedSpeaking) return;
        hasFinishedSpeaking = true;
        isAgentProcessing = false;
        stopVoiceMorphAnimation();
        if (isAgentActive) {
          setTimeout(() => {
            startSahilListeningState();
          }, 400);
        }
      };

      utterance.onend = finishSpeakingOnce;
      utterance.onerror = finishSpeakingOnce;

      window.speechSynthesis.speak(utterance);
      
      // Fallback timer in case speech synthesis end event fails on some mobile/desktop browsers
      setTimeout(() => {
        if (!window.speechSynthesis.speaking && isAgentProcessing) {
          finishSpeakingOnce();
        }
      }, Math.max(3000, text.length * 80));
    }
  </script>
