<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahil AI - Serverless Voice Agent</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 500px;
      text-align: center;
    }
    h1 { margin-bottom: 1rem; font-size: 1.5rem; }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #4f46e5; }
    button.active { background: #ef4444; }
    .status { margin: 1rem 0; font-weight: 500; color: #38bdf8; }
    .logs {
      background: #090d16;
      border-radius: 8px;
      padding: 1rem;
      height: 250px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.85rem;
      font-family: monospace;
      color: #cbd5e1;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Sahil AI - Serverless Voice Agent</h1>
  <button id="toggleBtn" onclick="toggleAgent()">Start Test</button>
  <div class="status" id="statusText">Status: Idle</div>
  <div class="logs" id="logBox">> Logs will appear here...</div>
</div>

<script>
  let isListening = false;
  let isProcessing = false;
  let hasGreeted = false;
  let recognition;
  let conversationHistory = [];
  let availableVoices = [];

  function loadVoices() {
    availableVoices = window.speechSynthesis.getVoices();
  }
  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  const siteData = `
Name: Sahil Kumar
Role: Visual Content Designer & Video Editor
Location: India
Primary Skills: AI Posters, High-CTR Thumbnails, CapCut Motion Video Editing, Short-form reels.
Tools Used: Canva, CapCut, Google AI Studio, LLM Workflows.
Philosophy: Focuses on high-end visual execution, practical design skills, speed, and CTR results.
Age: 19 years old (ONLY mention if explicitly asked by the user).
`;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = async (event) => {
      if (isProcessing) return;
      
      const lastIndex = event.results.length - 1;
      const transcript = event.results[lastIndex][0].transcript.trim();
      
      if (!transcript) return;

      log(`> User Said: ${transcript}`);
      stopListening();
      
      await sendToBackend(transcript);
    };

    recognition.onerror = (err) => {
      if (err.error !== 'no-speech') {
        log(`> Speech Error: ${err.error}`);
      }
    };
  } else {
    alert('Speech Recognition is not supported in this browser.');
  }

  function toggleAgent() {
    if (isListening) {
      stopListening();
    } else {
      if (!hasGreeted) {
        const initialGreeting = "Hey there! I'm Sahil Kumar. Welcome to my portfolio—what high-converting design or video project are we working on today?";
        hasGreeted = true;
        log(`> Sahil: ${initialGreeting}`);
        conversationHistory.push({ role: 'model', text: initialGreeting });
        speakReply(initialGreeting);
      } else {
        startListening();
      }
    }
  }

  function startListening() {
    isListening = true;
    isProcessing = false;
    document.getElementById('toggleBtn').innerText = 'Stop Test';
    document.getElementById('toggleBtn').classList.add('active');
    document.getElementById('statusText').innerText = 'Status: Listening... (Speak naturally)';
    try { recognition.start(); } catch(e){}
  }

  function stopListening() {
    isListening = false;
    document.getElementById('toggleBtn').innerText = 'Start Test';
    document.getElementById('toggleBtn').classList.remove('active');
    try { recognition.stop(); } catch(e){}
  }

  async function sendToBackend(userText) {
    isProcessing = true;
    document.getElementById('statusText').innerText = 'Status: Processing...';

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          userQuery: userText, 
          siteData: siteData,
          history: conversationHistory 
        })
      });

      const data = await response.json();

      if (data.reply) {
        log(`> Sahil: ${data.reply}`);
        
        conversationHistory.push({ role: 'user', text: userText });
        conversationHistory.push({ role: 'model', text: data.reply });

        speakReply(data.reply);
      }
    } catch (err) {
      log(`> Network Error: ${err.message}`);
      isProcessing = false;
      startListening();
    }
  }

  function speakReply(text) {
    document.getElementById('statusText').innerText = 'Status: Sahil Speaking...';
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    
    const isHindi = /[\u0900-\u097F]/.test(text);
    
    if (availableVoices.length === 0) {
      availableVoices = window.speechSynthesis.getVoices();
    }

    let selectedVoice = null;

    if (isHindi) {
      utterance.lang = 'hi-IN';
      selectedVoice = availableVoices.find(v => 
        v.lang === 'hi-IN' || 
        v.lang === 'hi_IN' || 
        v.name.includes('Hindi') || 
        v.name.includes('Google हिन्दी')
      );
    } else {
      utterance.lang = 'en-IN';
      selectedVoice = availableVoices.find(v => 
        v.lang === 'en-IN' || 
        v.lang === 'en_IN' || 
        v.name.includes('India')
      );
    }

    if (selectedVoice) {
      utterance.voice = selectedVoice;
    }

    utterance.rate = 1.0; 
    utterance.pitch = 1.0;

    const onAudioEnd = () => {
      isProcessing = false;
      startListening();
    };

    utterance.onend = onAudioEnd;
    utterance.onerror = onAudioEnd;

    window.speechSynthesis.speak(utterance);
  }

  function log(msg) {
    const box = document.getElementById('logBox');
    box.innerText += `\n${msg}`;
    box.scrollTop = box.scrollHeight;
  }
</script>

</body>
</html>
