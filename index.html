<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Sahil Kumar</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Google Font: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- AOS (Animate on Scroll) Library -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          },
          animation: {
            'blob-pulse': 'blob 10s infinite ease-in-out',
            'float': 'float 6s ease-in-out infinite',
            'earth-spin': 'earthSpin 25s linear infinite',
          },
          keyframes: {
            blob: {
              '0%, 100%': { transform: 'scale(1) translate(0px, 0px)' },
              '50%': { transform: 'scale(1.15) translate(20px, -20px)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            earthSpin: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(229, 231, 235, 0.8);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-indigo-500 selection:text-white min-h-screen relative overflow-x-hidden">

  <!-- BACKGROUND GLOW ORBS -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[350px] sm:w-[600px] lg:w-[800px] h-[350px] sm:h-[600px] lg:h-[800px] rounded-full bg-gradient-to-tr from-indigo-300/40 via-purple-300/40 to-pink-300/40 blur-[90px] lg:blur-[130px] animate-blob-pulse"></div>
    <div class="absolute top-[40%] left-[-10%] w-[300px] sm:w-[500px] h-[300px] sm:h-[500px] rounded-full bg-gradient-to-br from-blue-200/40 to-indigo-200/40 blur-[80px] animate-float"></div>
    <div class="absolute bottom-[5%] right-[-10%] w-[350px] sm:w-[550px] h-[350px] sm:h-[550px] rounded-full bg-gradient-to-tl from-purple-200/40 to-pink-200/40 blur-[90px] animate-blob-pulse"></div>
  </div>

  <!-- NAVIGATION BAR -->
  <header class="fixed top-5 inset-x-0 z-50 flex justify-center px-4 pointer-events-none" data-aos="fade-down" data-aos-duration="1000">
    <nav class="pointer-events-auto glass-nav rounded-full px-4 sm:px-6 py-2.5 shadow-lg shadow-indigo-950/5 flex items-center justify-between gap-6 sm:gap-10 transition-all duration-300 hover:shadow-xl">
      <a href="#hero" class="text-xs font-black tracking-widest text-indigo-600 uppercase transition-opacity hover:opacity-80">
        SK
      </a>
      <div class="flex items-center gap-1 sm:gap-2">
        <a href="#about" class="p-2 sm:px-3 sm:py-1.5 rounded-full text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/80 transition-all flex items-center gap-1.5 text-xs sm:text-sm font-medium" title="Identity">
          <i data-lucide="user" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Identity</span>
        </a>
        <a href="#showcase" class="p-2 sm:px-3 sm:py-1.5 rounded-full text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/80 transition-all flex items-center gap-1.5 text-xs sm:text-sm font-medium" title="Showcase">
          <i data-lucide="layout-grid" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Showcase</span>
        </a>
        <a href="#capabilities" class="p-2 sm:px-3 sm:py-1.5 rounded-full text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/80 transition-all flex items-center gap-1.5 text-xs sm:text-sm font-medium" title="Capabilities">
          <i data-lucide="cpu" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Capabilities</span>
        </a>
        <a href="#connect" class="p-2 sm:px-3 sm:py-1.5 rounded-full bg-indigo-600 text-white hover:bg-indigo-700 transition-all flex items-center gap-1.5 text-xs sm:text-sm font-medium shadow-md shadow-indigo-600/20" title="Connect">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Connect</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- HERO SECTION -->
    <section id="hero" class="min-h-screen flex flex-col justify-center items-center text-center pt-24 pb-12">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/80 border border-slate-200/80 shadow-sm text-xs font-semibold text-slate-700 mb-8" data-aos="fade-down" data-aos-duration="1000">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        <span>Available for Select Projects & Roles</span>
      </div>

      <div class="h-20 sm:h-32 md:h-40 lg:h-48 flex items-center justify-center w-full max-w-5xl overflow-hidden px-2" data-aos="zoom-in" data-aos-duration="1200">
        <h1 id="hero-title" class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-extrabold tracking-tight text-slate-900 transition-all duration-700 ease-in-out opacity-100 transform translate-y-0 leading-tight">
          PORTFOLIO BY
        </h1>
      </div>

      <p class="mt-6 text-base sm:text-xl lg:text-2xl text-slate-600 max-w-3xl font-light leading-relaxed" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="200">
        Crafting <span class="font-semibold text-indigo-600">High-CTR Visuals</span>, <span class="font-semibold text-purple-600">Hyper-Realistic AI Concepts</span> & <span class="font-semibold text-pink-600">High-Engagement Motion Edits</span>[cite: 1].
      </p>

      <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4 w-full max-w-sm sm:max-w-none" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="400">
        <a href="#showcase" class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-lg shadow-indigo-600/25 hover:shadow-indigo-600/35 transition-all flex items-center justify-center gap-2 group">
          <span>Explore Showcase</span>
          <i data-lucide="arrow-down" class="w-4 h-4 transition-transform group-hover:translate-y-1"></i>
        </a>
        <a href="#connect" class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-white hover:bg-slate-100 border border-slate-200 text-slate-800 font-semibold text-sm shadow-sm transition-all flex items-center justify-center gap-2">
          <span>Get in Touch</span>
          <i data-lucide="message-square" class="w-4 h-4 text-slate-500"></i>
        </a>
      </div>
    </section>
